name: numpy
modules:

- name: cython
  buildsystem: simple
  build-commands:
  - python3 setup.py install --prefix=${FLATPAK_DEST} --root=/
  sources:
  - type: archive
    url: https://github.com/cython/cython/releases/download/3.3.0/cython-3.3.0.tar.gz
    sha256: eed0d93fbca7087f143b42c34b05a825849bdf17f101572c2105acfa49aa88b8

- name: numpy
  buildsystem: simple
  build-commands:
    - ./vendored-meson/meson/meson.py setup builddir
      -Dallow-noblas=false -Dcpu-baseline=X86_V3
      --buildtype=debugoptimized
      --prefix=${FLATPAK_DEST}
    - cd builddir && ninja
    - cd builddir && ninja install
  build-options:
    env:
      ATLAS: None
      BLAS: "/app/lib"
      LAPACK: "/app/lib"
  cleanup:
    - "/bin"
  sources:
    - type: archive
      url: https://github.com/numpy/numpy/releases/download/v2.5.3/numpy-2.5.3.tar.gz
      sha256: df2d5874ff183595a4ba404edd04f6bd9b5505c1d7708573f6a6c17489a67563

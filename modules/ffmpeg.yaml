name: ffmpeg
modules:
- name: svt-av1
  buildsystem: cmake-ninja
  builddir: true
  sources:
    - type: git
      url: https://gitlab.com/AOMediaCodec/SVT-AV1.git
      tag: v4.2.0

- name: libx264
  config-opts:
    - --disable-cli
    - --enable-shared
  sources:
    - type: git
      url: https://code.videolan.org/videolan/x264.git
      commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

- name: x265
  buildsystem: cmake-ninja
  builddir: true
  subdir: source
  config-opts:
    - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    - -DENABLE_SHARED=ON
    - -DENABLE_CLI=OFF
  sources:
    - type: archive
      url: https://deb.debian.org/debian/pool/main/x/x265/x265_4.2.orig.tar.gz
      sha256: 40b1ea0453e0309f0eba934e0ddf533f8f6295966679e8894e8f1c1c8d5e1210

- name: ffmpeg
  config-opts:
    - --enable-shared
    - --disable-static
    - --disable-doc
    - --disable-manpages
    - --disable-stripping
    - --disable-ffplay
    - --disable-ffprobe

    - --enable-gpl
    - --enable-version3
    - --enable-optimizations
    - --enable-pthreads
    - --enable-gnutls
    - --enable-libxcb-xfixes
    - --enable-opengl
    - --enable-opencl
    - --enable-sdl2
    - --enable-vaapi
    - --enable-vdpau
    - --enable-zlib
    - --enable-bzlib
    - --enable-lzma

    - --enable-fontconfig
    - --enable-libfontconfig
    - --enable-libfreetype
    - --enable-libxml2

    - --enable-avcodec
    - --enable-avfilter
    - --enable-swscale

    - --enable-libxcb
    - --enable-protocol=file

    # Codecs we need / want: FFV1, AV1, VP9, H.264, HEVC
    - --enable-libsvtav1
    - --enable-libvpx
    - --enable-libx264
    - --enable-libx265
  cleanup:
    - /share/ffmpeg/examples
  sources:
    - type: archive
      url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
      sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

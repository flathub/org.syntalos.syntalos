id: org.syntalos.syntalos
runtime: org.kde.Sdk
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: syntalos
rename-icon: syntalos
rename-desktop-file: syntalos.desktop

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=all
  - --filesystem=host
  - --socket=system-bus
  - --socket=session-bus
  - --socket=pulseaudio
  - --allow=devel
  - --allow=bluetooth
  - --filesystem=/run/udev:ro  # needed for libcamera's udev enumeration & some controllers
  - --filesystem=xdg-run/pipewire-0:ro
  - --env=PATH=/app/bin:/usr/bin:/usr/sbin
  - --env=GST_PLUGIN_PATH=/app/lib/gstreamer-1.0:/usr/lib/extensions/gstreamer-1.0
  - --require-version=1.14.0

cleanup-commands:
  # we can't run the "cleanup-BaseApp-QtWebEngine.sh" script, as it will nuke
  # include files and pkgconfig data that we want to keep in the final bundle
  - rm /app/cleanup-BaseApp-QtWebEngine.sh
  - /app/cleanup-BaseApp.sh
  - rm -rfv ${FLATPAK_DEST}/bin/event_rpcgen.py
  - rm -rfv ${FLATPAK_DEST}/bin/qwebengine_convert_dict
  - rm -rfv ${FLATPAK_DEST}/lib/${FLATPAK_ARCH}-linux-gnu/metatypes
  - rm -rfv ${FLATPAK_DEST}/lib/${FLATPAK_ARCH}-linux-gnu/*.prl
  - rm -rfv ${FLATPAK_DEST}/lib/libexec/{gn,qwebengine_convert_dict}
  - rm -rfv ${FLATPAK_DEST}/lib/metatypes
  - rm -rfv ${FLATPAK_DEST}/mkspecs
  - rm -rfv ${FLATPAK_DEST}/lib/modules
  - rm -rfv ${FLATPAK_DEST}/lib/plugins/designer

modules:

  - name: OpenCL
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v2026.05.29.tar.gz
        sha256: d9e6c48357de5002da11ce45de600e0c3ffe6ab4f628a3b9fe2b38603161658a

  - name: toml++
    buildsystem: meson
    builddir: true
    sources:
      - type: archive
        url: https://github.com/marzer/tomlplusplus/archive/refs/tags/v3.4.0.tar.gz
        sha256: 8517f65938a4faae9ccf8ebb36631a38c1cadfb5efa85d9a72e15b9e97d25155

  - name: blake3
    buildsystem: cmake-ninja
    builddir: true
    subdir: c/
    config-opts:
      - -DBUILD_SHARED_LIBS:BOOL=YES
    sources:
      - type: archive
        url: https://github.com/BLAKE3-team/BLAKE3/archive/refs/tags/1.8.7.tar.gz
        sha256: c6782a28842b1c0478524ac06a4f2ede784038ee298d6e2162c0b089c4306a3c

  - name: iceoryx2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_CXX=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/iceoryx2/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      - type: archive
        url: https://github.com/eclipse-iceoryx/iceoryx2/archive/refs/tags/v0.9.3.tar.gz
        sha256: 2b4438364614b390938354ac766c198bb2ad63a2bde84a142c53f555fe8f4bc1
      - modules/iceoryx2-cargo-sources.json

  - name: quill
    buildsystem: meson
    builddir: true
    sources:
      - type: archive
        url: https://github.com/odygrd/quill/releases/download/v13.0.0/quill-13.0.0.zip
        sha256: efb6ac9eea48633b05ebffae1dfee00fb065199bdc7686ea3353f77de09bbfa9

  - name: mimalloc
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DMI_BUILD_SHARED:BOOL=ON
      - -DMI_BUILD_STATIC:BOOL=OFF
      - -DMI_BUILD_OBJECT:BOOL=OFF
      - -DMI_OVERRIDE:BOOL=ON
      - -DMI_OPT_ARCH:BOOL=ON
      - -DMI_INSTALL_TOPLEVEL:BOOL=ON
    sources:
      - type: archive
        url: https://github.com/microsoft/mimalloc/releases/download/v3.5.1/mimalloc-v3.5.1-source.tar.gz
        sha256: bff20d5423e63d751858dcc4f6ca2d346e16a84f8410f868bc3a298996c1ea1e

  - name: openblas
    no-autogen: true
    make-args:
      - DYNAMIC_ARCH=1
      - FC=gfortran
      - NO_LAPACKE=1
      - USE_OPENMP=1
      - NO_WARMUP=1
      - NUM_THREADS=128
    make-install-args:
      - PREFIX=/app
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/archive/v0.3.34.tar.gz
        sha512: b40b5a3b5062ea196b3e48363db584ef91aef21c61becf4f4d6616ba5e413d770c22445c357d06dcf0992dd4666c18cced44cd5d09d8cb884c0d8f62e6940422
        x-checker-data:
          type: anitya
          project-id: 2540
          url-template: https://github.com/OpenMathLib/OpenBLAS/archive/v$version.tar.gz

  - name: eigen3
    buildsystem: cmake-ninja
    builddir: true
    cleanup: [] # we don't cleanup headers for Syntalos C++ developer modules
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.bz2
        sha256: b4c198460eba6f28d34894e3a5710998818515104d6e74e5cc331ce31e46e626

  - modules/usbutils.yaml
  - modules/ffmpeg.yaml

  - name: pybind11
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DPYBIND11_INSTALL:BOOL=ON
      - -DPYBIND11_TEST:BOOL=OFF
      - -DPYTHON_INCLUDE_DIRS=/usr/include/python3.13
    sources:
      - type: archive
        url: https://github.com/pybind/pybind11/archive/refs/tags/v3.1.0.tar.gz
        sha256: ef712655692a2e9bf7bb7874c022564a45f91d847ddee987e720cd9e28849665

  - modules/git.yaml
  - modules/numpy.yaml
  - modules/opencv.yaml
  - modules/iir1.yaml
  - modules/qtermwidget.yaml
  - modules/zeromq.yaml
  - modules/winpos-qt.yaml
  - modules/nlohmann-json.yaml
  - modules/python/module-requirements.yaml
  - modules/aravis.yaml
  - modules/libcamera.yaml
  - modules/tiscamera.yaml

  # Syntalos' Intan-RHX module requires Lua 5.3 for the OpalKelly FrontPanel library
  - shared-modules/lua5.3/lua-5.3.5.json
  - name: okfrontpanel-liblua-compat-symlink
    buildsystem: simple
    build-commands:
      - ln -sf liblua.so.5.3 /app/lib/liblua5.3.so.0

  # the Miniscope module needs libminiscope via PoMiDAQ
  - name: pomidaq
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DPYTHON=OFF
      - -DGUI=OFF
    sources:
      - type: git
        url: https://github.com/bothlab/pomidaq.git
        tag: v0.6.1

  - name: syntalos
    buildsystem: meson
    builddir: true
    cleanup: [] # we don't clean up development headers for the C++ workbench Syntalos module
    config-opts:
      - -Doptimize-modern-amd64=true
      - -Dudevdir=/app/lib/udev
    build-options:
      arch:
        aarch64:
          config-opts:
            - -Ddisabled-modules=intan-rhx,open-ephys-acq
    sources:
      - type: git
        url: https://github.com/syntalos/syntalos.git
        tag: v3.2.0
        commit: c16eafd7647d985af177203a98f0a21f4cd44566
        # there's broken LFS objects in liboni (which we don#t need), so we can't have this on
        disable-lfs: true
